method: POST
body:
  type: json
  content: "{\r

    \    \"input\": {\r

    \        \"username\": \"user2@myemail\"\r

    \    },\r

    \    \"token\": {\r

    \        \"tokenId\": \"randomnonexistentToken\",\r

    \        \"username\": \"{{tokenUsername}}\",\r

