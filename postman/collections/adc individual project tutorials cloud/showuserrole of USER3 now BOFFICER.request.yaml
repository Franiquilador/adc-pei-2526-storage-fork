$kind: http-request
name: showuserrole of USER3 now BOFFICER
url: https://first-web-application-489212.oa.r.appspot.com/rest/showuserrole
method: POST
body:
  type: json
  content: "{\r

    \    \"input\": {\r

    \        \"username\": \"user3@myemail\"\r

    \    },\r

    \    \"token\": {\r

    \        \"tokenId\": \"{{tokenId}}\",\r

    \        \"username\": \"{{tokenUsername}}\",\r

    \        \"role\": \"{{tokenRole}}\",\r

    \        \"issuedAt\": {{tokenIssuedAt}},\r

    \        \"expiresAt\": {{tokenExpiresAt}}\r

    \    }\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json(); // pm stands for postman, and it is for
      loading the json response\r

      \r

      // checks that the status code is 200 OK\r

      pm.test(\"Status is 200\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      // checks that the status field is \"success\" like it should be\r

      pm.test(\"Status is success\", () => {\r

      \  pm.expect(json.status).to.eql(\"success\");\r

      });\r

      \r

      // check that the data object exists \r

      pm.test(\"Data object exists\", () => {\r

      \  pm.expect(json).to.have.property(\"data\");\r

      });\r

      \r

      // Check username echoed back correctly\r

      pm.test(\"Username matches input\", () => {\r

      \  pm.expect(json.data.username).to.eql(\"user3@myemail\");\r

      });\r

      \r

      // Check role is correct\r

      pm.test(\"Role is BOFFICER\", () => {\r

      \  pm.expect(json.data.role).to.eql(\"BOFFICER\");\r

      });\r

      \r

      // Check sensitive fields are NOT exposed in response\r

      pm.test(\"Password not returned\", () => {\r

      \  pm.expect(json.data).to.not.have.property(\"password\");\r

      });"
    language: text/javascript
order: 34000
