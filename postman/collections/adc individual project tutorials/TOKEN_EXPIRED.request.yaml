$kind: http-request
name: TOKEN_EXPIRED
url: http://localhost:8080/rest/showusers
method: POST
body:
  type: json
  content: "{\r

    \    \"input\": {},\r

    \    \"token\": {\r

    \        \"tokenId\": \"{{tokenId}}\",\r

    \        \"username\": \"{{tokenUsername}}\",\r

    \        \"role\": \"{{tokenRole}}\",\r

    \        \"issuedAt\": {{tokenIssuedAt}},\r

    \        \"expiresAt\": {{tokenExpiresAtBefore}}\r

    \    }\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      // Check it did not succeed\r

      pm.test(\"Status is error code 9904\", () => {\r

      \  pm.expect(json.status).to.eql(\"9904\");\r

      });\r

      \r

      // Check the error message\r

      pm.test(\"token expired\", () => {\r

      \  pm.expect(json.data).to.eql(\"The operation is called with a token that
      is expired\");\r

      });"
    language: text/javascript
order: 11000
