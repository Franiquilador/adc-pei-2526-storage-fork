$kind: http-request
name: INVALID_CREDENTIALS
url: http://localhost:8080/rest/login
method: POST
body:
  type: json
  content: "{\r

    \    \"input\": {\r

    \        \"username\": \"adm1@myemail\",\r

    \        \"password\": \"pd\"\r

    \    }\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      // Check it did not succeed\r

      pm.test(\"Status is error code 9900\", () => {\r

      \  pm.expect(json.status).to.eql(\"9900\");\r

      });\r

      \r

      // Check the error message\r

      pm.test(\"Duplicate username error message\", () => {\r

      \  pm.expect(json.data).to.eql(\"The username-password pair is not
      valid\");\r

      });"
    language: text/javascript
order: 5000
