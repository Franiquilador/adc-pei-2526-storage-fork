$kind: http-request
name: USER_NOT_FOUND
url: http://localhost:8080/rest/login
method: POST
body:
  type: json
  content: "{\r

    \    \"input\": {\r

    \        \"username\": \"am1@myemail\",\r

    \        \"password\": \"pwd\"\r

    \    }\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      // Check it did not succeed\r

      pm.test(\"Status is error code 9902\", () => {\r

      \  pm.expect(json.status).to.eql(\"9902\");\r

      });\r

      \r

      // Check the error message\r

      pm.test(\"Username not found\", () => {\r

      \  pm.expect(json.data).to.eql(\"The username referred in the operation
      doesn’t exist in registered accounts\");\r

      });"
    language: text/javascript
order: 6000
