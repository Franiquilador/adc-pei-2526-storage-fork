      pm.test(\"Status is error code 9903\", () => {\r

      \  pm.expect(json.status).to.eql(\"9903\");\r

      });\r

      \r

      // Check the error message\r

      pm.test(\"invalid token\", () => {\r

      \  pm.expect(json.data).to.eql(\"The operation is called with an invalid
      token (wrong format for example)\");\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: //console.log("expiresAt value being sent:",
