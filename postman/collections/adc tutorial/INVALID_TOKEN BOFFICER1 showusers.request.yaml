method: POST
body:
  type: json
  content: "{\r

    \    \"input\": {},\r

    \    \"token\": {\r

    \        \"tokenId\": \"{{tokenIdBofficer1}}\",\r

    \        \"username\": \"{{tokenUsernameBofficer1}}\",\r

    \        \"role\": \"{{tokenRoleBofficer1}}\",\r

    \        \"issuedAt\": {{tokenIssuedAtBofficer1}},\r

    \        \"expiresAt\": {{tokenExpiresAtBofficer1}}\r

    \    }\r

    }"
