$kind: http-request
name: ChangeUserPassword of ADM1
url: http://localhost:8080/rest/changeuserpwd
method: POST
body:
  type: json
  content: "{\r

    \    \"input\": {\r

    \        \"username\": \"adm1@myemail\",\r

    \        \"oldPassword\": \"pwd\",\r

    \        \"newPassword\": \"pwd2\"\r

    \    },\r

    \    \"token\": {\r

    \        \"tokenId\": \"{{tokenId}}\",\r

    \        \"username\": \"{{tokenUsername}}\",\r

    \        \"role\": \"{{tokenRole}}\",\r

    \        \"issuedAt\": {{tokenIssuedAt}},\r

    \        \"expiresAt\": {{tokenExpiresAt}}\r

    \    }\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      \r

      pm.test(\"Status is 200\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Status is success\", () => {\r

      \  pm.expect(json.status).to.eql(\"success\");\r

      });\r

      \r

      pm.test(\"Data object exists\", () => {\r

      \  pm.expect(json).to.have.property(\"data\");\r

      });\r

      \r

      pm.test(\"message confirmation\", () => {\r

      \  pm.expect(json.data.message).to.eql(\"Password changed
      successfully\");\r

      });"
    language: text/javascript
order: 34573
